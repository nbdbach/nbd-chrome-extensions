name: Release

# Tag format: <extension-name>@<version>, e.g. auto-refresh@1.0.0
on:
  push:
    tags:
      - '*@*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Parsing lives in scripts/release-tag.ts so it is unit tested rather
      # than living only in this file.
      - name: Parse tag
        id: tag
        run: npx tsx scripts/release-tag.ts parse "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - run: npm run check

      - run: npm run package -- "${{ steps.tag.outputs.name }}"

      # Nothing is published unless the artifact's own version matches the tag.
      # Without this, tagging a commit whose manifest was never bumped ships a
      # build labelled with the previous version, and the first place anyone
      # notices is the store listing.
      - name: Verify the packaged version matches the tag
        run: |
          npx tsx scripts/release-tag.ts verify "$GITHUB_REF_NAME" \
            "extensions/${{ steps.tag.outputs.name }}/dist/manifest.json"

      # The attached zip is the artifact submitted to the Web Store, so anyone
      # can rebuild from this tag and compare.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            releases/*.zip
